version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: baoleme-pg
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: baoleme
      POSTGRES_PASSWORD: baoleme_dev
      POSTGRES_DB: baoleme
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
