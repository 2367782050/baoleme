name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: baoleme
          POSTGRES_PASSWORD: baoleme_ci
          POSTGRES_DB: baoleme
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U baoleme -d baoleme"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: "postgres://baoleme:baoleme_ci@localhost:5432/baoleme?sslmode=disable"
      JWT_SECRET: "ci-test-secret-do-not-use-in-production"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      AI_PROVIDER: "mock"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Push schema
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Vitest (run 1)
        run: npm run test

      - name: Vitest (run 2)
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Console check (tsx)
        run: |
          npx next dev --port 3000 &
          sleep 5
          npx tsx scripts/console-check.ts

      - name: Playwright E2E
        run: npm run verify:e2e

      - name: Screenshots
        run: |
          npx next dev --port 3000 &
          sleep 5
          npx tsx scripts/screenshots.ts
